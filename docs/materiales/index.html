const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(p,s){const bk=await crypto.subtle.importKey('raw',enc.encode(p),{name:'PBKDF2'},false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:B.iter,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);}

catch(_){e.textContent='Contraseña incorrecta.';}});
